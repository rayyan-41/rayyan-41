<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg">
  <!-- Window shadow -->
  <rect x="6" y="6" width="468" height="198" fill="#888" />

  <!-- Main window body -->
  <rect x="0" y="0" width="468" height="198" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="2" y="2" width="464" height="22" fill="url(#titleGrad)"/>
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1084d0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title text -->
  <text x="10" y="16" fill="white" font-size="11" font-weight="bold" font-family="'Trebuchet MS', sans-serif">💻  welcome.exe — Rayyan Ahmad Sultan</text>

  <!-- Title bar buttons -->
  <rect x="382" y="4" width="18" height="16" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <text x="388" y="16" fill="black" font-size="10" font-family="Arial">_</text>
  <rect x="403" y="4" width="18" height="16" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <rect x="406" y="8" width="12" height="9" fill="none" stroke="black" stroke-width="1.5"/>
  <rect x="424" y="4" width="18" height="16" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <text x="429" y="16" fill="black" font-size="11" font-weight="bold" font-family="Arial">✕</text>

  <!-- Inner content area -->
  <rect x="8" y="30" width="452" height="122" fill="white" stroke="#808080" stroke-width="1"/>
  <rect x="9" y="31" width="450" height="120" fill="white" stroke="#dfdfdf" stroke-width="1"/>

  <!-- Icon -->
  <text x="18" y="88" font-size="48" font-family="sans-serif">🖥️</text>

  <!-- Message text -->
  <text x="84" y="52" fill="#000000" font-size="13" font-weight="bold" font-family="'Trebuchet MS', sans-serif">Hey! I'm Nia 👋</text>
  <text x="84" y="72" fill="#333333" font-size="11" font-family="'Trebuchet MS', sans-serif">CS undergrad @ FAST NUCES.</text>
  <text x="84" y="88" fill="#333333" font-size="11" font-family="'Trebuchet MS', sans-serif">Welcome to my Github profile.</text>
  <text x="84" y="108" fill="#333333" font-size="11" font-family="'Trebuchet MS', sans-serif">NOTE ⚠️: This profile contains ungodly amounts of caffeine.</text>

  <!-- Divider -->
  <line x1="8" y1="159" x2="460" y2="159" stroke="#808080" stroke-width="1"/>
  <line x1="8" y1="160" x2="460" y2="160" stroke="#dfdfdf" stroke-width="1"/>

  <!-- Buttons -->
  <!-- OK -->
  <rect x="152" y="168" width="75" height="24" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <rect x="151" y="167" width="75" height="24" fill="#d4d0c8" stroke="white" stroke-width="1"/>
  <text x="178" y="184" fill="black" font-size="11" font-family="'Trebuchet MS', sans-serif">OK</text>
  <rect x="154" y="170" width="69" height="19" fill="none" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- View Profile -->
  <rect x="240" y="168" width="90" height="24" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <rect x="239" y="167" width="90" height="24" fill="#d4d0c8" stroke="white" stroke-width="1"/>
  <text x="252" y="184" fill="black" font-size="11" font-family="'Trebuchet MS', sans-serif">View Profile</text>

  <!-- Cancel -->
  <rect x="343" y="168" width="75" height="24" fill="#d4d0c8" stroke="#808080" stroke-width="1"/>
  <rect x="342" y="167" width="75" height="24" fill="#d4d0c8" stroke="white" stroke-width="1"/>
  <text x="361" y="184" fill="black" font-size="11" font-family="'Trebuchet MS', sans-serif">Cancel</text>
</svg>
